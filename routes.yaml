routes:
  /signup/: members/signup
  /signin/: members/signin
  /account/: members/account
  /membership/: members/membership

  # Language routes
  /de/:
    controller: channel
    template: index
    filter: 'tag:de'
  
  /en/:
    controller: channel
    template: index
    filter: 'tag:en'

  # Language-specific content routes
  /de/{slug}/:
    controller: entry
    filter: 'tag:de+tag:-[hash-portfolio,hash-kusi-doc,hash-podcast]'
    template: index

  /en/{slug}/:
    controller: entry
    filter: 'tag:en+tag:-[hash-portfolio,hash-kusi-doc,hash-podcast]'
    template: index

  # Language-specific post routes
  /de/post/{slug}/:
    controller: entry
    filter: 'tag:de+tag:-[hash-portfolio,hash-kusi-doc,hash-podcast]'
    template: post

  /en/post/{slug}/:
    controller: entry
    filter: 'tag:en+tag:-[hash-portfolio,hash-kusi-doc,hash-podcast]'
    template: post

  # Portfolio routes
  /portafolio/{slug}/:
    controller: entry
    filter: 'tag:[hash-portfolio]'
    template: godo-template-portfolio
    data:
      post: page.porftfolio

  # Podcast routes
  /podcast/{slug}/:
    controller: entry
    filter: 'tag:[hash-podcast]'
    template: godo-podcast
    data:
      post: page.podcast

  # Documentation routes
  /docs/{slug}/:
    controller: entry
    filter: 'tag:[hash-kusi-doc]'
    template: godo-kusi-doc
    data:
      post: page.docs

  # Default post route (fallback)
  /{slug}/:
    controller: entry
    filter: 'tag:-[hash-portfolio,hash-kusi-doc,hash-podcast]'
    template: post

  # Author route
  /author/{slug}/:
    controller: author
    template: author
    filter: 'tag:-[hash-portfolio,hash-kusi-doc,hash-podcast]'

  # Tag route - exclude language tags
  /tag/{slug}/:
    controller: tag
    template: tag
    filter: 'slug:-[en,de]'

  # Medium with sidebar
  /medium-sidebar/:
    controller: channel
    template: godo-template-medium-sidebar
    data:
      post: page.medium-with-sidebar
    limit: 14

  /podcast/rss/:
    template: podcast/rss
    content_type: text/xml

collections:
  # PortFolio
  /portafolio/:
    permalink: /portafolio/{slug}/
    filter: 'tag:[hash-portfolio]'
    data: page.porftfolio
    template: godo-template-portfolio
    limit: all

  # Podcast
  /podcast/:
    permalink: /podcast/{slug}/
    filter: 'tag:[hash-podcast]'
    data: page.podcast
    template: godo-podcast
    limit: 10

  # Documentation
  /docs/:
    permalink: /docs/{slug}/
    filter: 'tag:[hash-kusi-doc]'
    template: godo-home-kusi-doc

  # Language-specific collections
  /de/:
    permalink: /de/{slug}/
    filter: 'tag:de+tag:-[hash-portfolio,hash-kusi-doc,hash-podcast]'
    template: index

  /en/:
    permalink: /en/{slug}/
    filter: 'tag:en+tag:-[hash-portfolio,hash-kusi-doc,hash-podcast]'
    template: index

  # Default (fallback for backward compatibility)
  /:
    permalink: /{slug}/
    template: index

taxonomies:
  tag: /tag/{slug}/
  author: /author/{slug}/
