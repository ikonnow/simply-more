routes:
  /signup/: members/signup
  /signin/: members/signin
  /account/: members/account
  /membership/: members/membership

  # Default route - German content only
  /:
    controller: channel
    filter: 'tag:de'
    template: index

  # Static pages
  /impressum/:
    controller: page
    template: page

  /datenschutz/:
    controller: page
    template: page

  /privacy-policy/:
    controller: page
    template: page

  /imprint/:
    controller: page
    template: page

  # Language-specific routes
  /de/:
    controller: channel
    filter: 'tag:de'
    template: index

  /en/:
    controller: channel
    filter: 'tag:en'
    template: index

  # Language-specific author routes
  /profil/:
    controller: channel
    filter: 'tag:team+tag:de'
    template: authors

  /team/:
    controller: channel
    filter: 'tag:team+tag:en'
    template: authors

  # Individual post/page routes - German
  /info/{slug}/:
    controller: entry
    filter: 'tag:kusi-doc+tag:de'
    data:
      post: page.custom-kusi-doc
    template: custom-kusi-doc

  /profil/{slug}/:
    controller: entry
    filter: 'tag:team+tag:de'
    data:
      post: page.author
    template: author

  /referenzen/{slug}/:
    controller: entry
    filter: 'tag:portfolio+tag:de'
    data:
      post: page.portfolio
    template: godo-template-portfolio

  /aktuell/{slug}/:
    controller: entry
    filter: 'tag:news+tag:de'
    data:
      post: page.post
    template: post

  # Individual post/page routes - English
  /faq/{slug}/:
    controller: entry
    filter: 'tag:kusi-doc+tag:en'
    data:
      post: page.custom-kusi-doc
    template: custom-kusi-doc

  /team/{slug}/:
    controller: entry
    filter: 'tag:team+tag:en'
    data:
      post: page.author
    template: author

  /portfolio/{slug}/:
    controller: entry
    filter: 'tag:portfolio+tag:en'
    data:
      post: page.portfolio
    template: godo-template-portfolio

  /now/{slug}/:
    controller: entry
    filter: 'tag:news+tag:en'
    data:
      post: page.post
    template: post

  # Podcast individual posts
  /podcast/{slug}/:
    controller: entry
    filter: 'tag:podcast'
    data:
      post: page.podcast
    template: godo-podcast

  # Default individual posts for language-specific content
  /de/{slug}/:
    controller: entry
    filter: 'tag:de+tag:-[kusi-doc,team,portfolio,news,podcast]'
    data:
      post: page.post
    template: post

  /en/{slug}/:
    controller: entry
    filter: 'tag:en+tag:-[kusi-doc,team,portfolio,news,podcast]'
    data:
      post: page.post
    template: post

  # Featured templates
  /featured/:
    controller: channel
    filter: 'tag:-portfolio'
    limit: 12
    template: godo-template-featured

  /archive/:
    controller: channel
    filter: 'tag:-portfolio'
    limit: all
    template: godo-archive

  /grid/:
    controller: channel
    filter: 'tag:-portfolio'
    limit: 12
    template: godo-template-grid

  /sidebar/:
    controller: channel
    filter: 'tag:-portfolio'
    limit: 12
    template: godo-template-sidebar

  /medium/:
    controller: channel
    filter: 'tag:-portfolio'
    template: godo-template-medium
    limit: 14

  /featured-slider/:
    controller: channel
    filter: 'tag:-portfolio'
    template: godo-template-featured-slider

  /photographer/:
    controller: channel
    filter: 'tag:-portfolio'
    template: godo-template-photographer
    limit: 12

  /personal/:
    template: godo-home-personal
    data: 
      post: page.godo-personal

  /medium-sidebar/:
    controller: channel
    template: godo-template-medium-sidebar
    data:
      post: page.medium-with-sidebar
    limit: 14

  /podcast/rss/:
    template: podcast/rss
    content_type: text/xml

collections:
  # German collections
  /info/:
    permalink: /info/{slug}/
    filter: 'tag:kusi-doc+tag:de'
    template: custom-kusi-doc

  /profil/:
    permalink: /profil/{slug}/
    filter: 'tag:team+tag:de'
    template: author

  /referenzen/:
    permalink: /referenzen/{slug}/
    filter: 'tag:portfolio+tag:de'
    template: godo-template-portfolio
    limit: all

  /aktuell/:
    permalink: /aktuell/{slug}/
    filter: 'tag:news+tag:de'
    template: index

  # English collections
  /faq/:
    permalink: /faq/{slug}/
    filter: 'tag:kusi-doc+tag:en'
    template: custom-kusi-doc

  /team/:
    permalink: /team/{slug}/
    filter: 'tag:team+tag:en'
    template: author

  /portfolio/:
    permalink: /portfolio/{slug}/
    filter: 'tag:portfolio+tag:en'
    template: godo-template-portfolio
    limit: all

  /now/:
    permalink: /now/{slug}/
    filter: 'tag:news+tag:en'
    template: index

  # Podcast
  /podcast/:
    permalink: /podcast/{slug}/
    filter: 'tag:podcast'
    template: godo-podcast
    limit: 10

  # Default collections for language-specific content
  /de/:
    permalink: /de/{slug}/
    filter: 'tag:de+tag:-[kusi-doc,team,portfolio,news,podcast]'
    template: post

  /en/:
    permalink: /en/{slug}/
    filter: 'tag:en+tag:-[kusi-doc,team,portfolio,news,podcast]'
    template: post

taxonomies:
  tag: /tag/{slug}/
  author: /author/{slug}/
